spring:
  application:
    name: dazi-community
  profiles:
    active: dev

server:
  port: 8080
  servlet:
    context-path: /

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.dazi.community.entity.po
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleteFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    root: info
    com.dazi.community.mapper: debug
